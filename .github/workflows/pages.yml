name: Pages

on:
  push:
    branches: [main]
    # The site uses none of the documentation, so changes to it alone don't redeploy.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the site
        run: bash scripts/build-web.sh
      # The scene takes minutes to bake and hundreds of megabytes to store, so it is baked on a
      # PC and kept in a release (scripts/publish-garden.py), which scene.txt names. A browser
      # cannot stream a file from a release, so the site serves a copy.
      - name: Fetch the scene from its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r file release sha < <(grep -v '^#' scene.txt | grep .)
          gh release download "$release" --repo "$GITHUB_REPOSITORY" --dir dist/assets \
            --pattern "$file" --pattern "${file%.solstice}.walk"
          echo "$sha  dist/assets/$file" | sha256sum --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
